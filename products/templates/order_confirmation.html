{% extends 'base.html' %}

{% block content %}

<div class="text-center mt-5">

    <h1 class="text-success">
        🎉 Order Placed Successfully!
    </h1>

    <p class="mt-3">
        Thank you for shopping with PyShop.
    </p>

    <h4 class="mt-4">
        Order #{{ order.id }}
    </h4>

    <h3>
    Total: ${{ order.total|floatformat:2 }}
</h3>

    <p class="text-muted mt-2">
        {{ order.created_at }}
    </p>

    <a href="{% url 'index' %}"
       class="btn btn-primary mt-4">
        Continue Shopping
    </a>

</div>

{% endblock %}
