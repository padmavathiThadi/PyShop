{% extends 'base.html' %}

{% block content %}

<div class="text-center">

    <h1 class="text-danger mb-4">
        ❌ Not Enough Stock
    </h1>

    <p>
        Sorry, there isn't enough stock for
        <strong>{{ product.name }}</strong>.
    </p>

    <p>
        You requested:
        <strong>{{ requested_quantity }}</strong>
    </p>

    <p>
        Available stock:
        <strong>{{ available_stock }}</strong>
    </p>

    <a href="{% url 'cart' %}"
       class="btn btn-primary mt-3">
        Back to Cart
    </a>

</div>

{% endblock %}
