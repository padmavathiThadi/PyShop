{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">Create Account</h1>

<form method="POST">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Register
    </button>

</form>

<p class="mt-3">
    Already have an account?
    <a href="{% url 'login' %}">Login</a>
</p>

{% endblock %}
