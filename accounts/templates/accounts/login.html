{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">Login</h1>

<form method="POST">

    {% csrf_token %}

    <input type="hidden"
           name="next"
           value="{{ next }}">

    {{ form.as_p }}

    <button type="submit" class="btn btn-primary">
        Login
    </button>

</form>

<p class="mt-3">
    Don't have an account?
    <a href="{% url 'register' %}">Create one</a>
</p>

{% endblock %}
